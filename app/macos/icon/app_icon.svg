<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Иконка MKV2MP4 («слои медиа»), палитра Matcha. PNG собираются скриптом macos/icon/build-icon.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7f1"/><stop offset="1" stop-color="#e3e6d6"/></linearGradient>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e201b" flood-opacity=".25"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#outer)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#1e201b" stroke-opacity=".08" stroke-width="1"/>
  <g filter="url(#sh)">
    <rect x="224" y="224" width="400" height="400" rx="90" fill="#4f6b2a"/>
    <rect x="312" y="312" width="400" height="400" rx="90" fill="#252821"/>
    <rect x="400" y="400" width="400" height="400" rx="90" fill="#c8de82"/>
  </g>
  <path d="M556 520 L676 600 L556 680 Z" fill="#1e2412"/>
</svg>
